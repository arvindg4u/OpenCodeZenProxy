services:
  - type: web
    name: opencodezenproxy
    runtime: python
    plan: free # 0.1 CPU / 512 MB — enough for a streaming proxy; upgrade anytime in the dashboard
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      # Optional: override the upstream target without editing code.
      - key: UPSTREAM_BASE
        value: https://opencode.ai/zen/v1
